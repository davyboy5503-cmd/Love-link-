
name: Build LoveLink APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract LoveLink source
        run: |
          unzip -q LoveLink-v0.1-source.zip -d source

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find source -name settings.gradle.kts -printf '%h\n' | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project at $PROJECT_DIR"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LoveLink-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
