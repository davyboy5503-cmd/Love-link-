
name: Build LoveLink APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'LoveLink-v0.1-source.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract LoveLink source
        run: |
          unzip -q LoveLink-v0.1-source.zip -d source

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find source -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Fix JVM target compatibility
        run: |
          FILE="$PROJECT_DIR/app/build.gradle.kts"
          sed -i '/android {/a\    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }' "$FILE"
          if grep -q 'kotlinOptions {' "$FILE"; then
            sed -i '/kotlinOptions {/a\        jvmTarget = "17"' "$FILE"
          else
            sed -i '/android {/a\    kotlinOptions {\n        jvmTarget = "17"\n    }' "$FILE"
          fi

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Locate and prepare APK
        run: |
          APK_PATH=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found"
            find "$PROJECT_DIR" -type f
            exit 1
          fi
          mkdir -p apk
          cp "$APK_PATH" apk/LoveLink-debug.apk
          echo "APK prepared successfully"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LoveLink-APK
          path: apk/LoveLink-debug.apk
          if-no-files-found: error
